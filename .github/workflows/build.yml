name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Same tools as locally (mise.toml): Arm GCC, GNU make, Python, uv, picotool.
      - uses: jdx/mise-action@v5

      - id: qmk
        run: echo "version=$(tr -d '[:space:]' < QMK_VERSION)" >> "$GITHUB_OUTPUT"

      # qmk_firmware plus submodules is large; reuse it per pinned version.
      - uses: actions/cache@v6
        with:
          path: .qmk_firmware
          key: qmk-firmware-${{ steps.qmk.outputs.version }}

      - run: mise run build

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: build/*.uf2
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: firmware
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Releases made by hand (e.g. v0.0.1, the firmware read back from the keyboard) stay untouched.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists, leaving it alone."
            exit 0
          fi
          uf2="dist/charybdis-3x5-splinky3-jigfox-${GITHUB_REF_NAME}.uf2"
          mv dist/*.uf2 "$uf2"
          gh release create "$GITHUB_REF_NAME" "$uf2" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
